// ==========================================================
// Настройки мода Half-Life 1: Randomizer Chaos
// ==========================================================

// Включить рандомные события (1 = вкл, 0 = пауза)
chaos_enabled "1"

// Интервал между рандомными событиями в секундах (по умолчанию 10)
chaos_interval "10"

// Звуковые сигналы обратного отсчёта и событий (1 = вкл, 0 = выкл)
chaos_sound "1"

// Русские описания событий в чате/консоли (1 = вкл, 0 = только HUD)
chaos_ru_chat "1"

// Полезные бинды (раскомментируйте при желании, убрав // в начале строки):
// bind "p" "chaos_toggle"
// bind "o" "chaos_now"
// bind "i" "chaos_status"
