// Half-Life 1: Randomizer Chaos — настройки по умолчанию
chaos_enabled "1"
chaos_interval "10"          // Допустимый диапазон: 2–300 секунд
chaos_sound "1"              // Звук только при наличии в precache карты
chaos_ru_chat "1"
chaos_intro_troll "1"        // Только фальшивая надпись, сейвы не удаляются
chaos_monsters "1"           // Только NPC, уже подготовленные картой; 0 отключает
chaos_spawn_limit "8"        // Не более 16 одновременно и 3 за событие
chaos_autojump "1"           // Повторные прыжки при удержании кнопки; 0 отключает
chaos_bhop_nocap "1"         // Экспериментально: не срезать скорость прыжка; 0 отключает
chaos_hev_hud "1"            // Оранжевый HUD в совместимом OF-клиенте; 0 — зелёный

// Не заменяйте существующие бинды, если они вам нужны:
// bind "p" "chaos_toggle"
// bind "o" "chaos_now"
// bind "v" "chaos_portal_blue"
// bind "b" "chaos_portal_orange"
// bind "n" "chaos_portal_enter"
